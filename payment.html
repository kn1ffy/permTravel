<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <meta name="theme-color" content="#0f2a0f">
    <title>NFC Билеты - PermTravel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Roboto', 'Poppins', 'Georgia', serif;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            animation: bgShift 20s ease-in-out infinite;
        }

        @keyframes bgShift {
            0% {
                background: radial-gradient(circle at 20% 30%, #1a3a1a, #0f2a0f, #051505);
            }
            20% {
                background: radial-gradient(circle at 40% 60%, #2a552a, #1a3a1a, #0a1f0a);
            }
            40% {
                background: radial-gradient(circle at 70% 40%, #236623, #143214, #082008);
            }
            60% {
                background: radial-gradient(circle at 80% 70%, #1e4a1e, #0f2f0f, #051505);
            }
            80% {
                background: radial-gradient(circle at 30% 80%, #2a552a, #1a3a1a, #0a1f0a);
            }
            100% {
                background: radial-gradient(circle at 20% 30%, #1a3a1a, #0f2a0f, #051505);
            }
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255, 215, 0, 0.08), transparent 70%);
            pointer-events: none;
            z-index: -1;
            animation: particles 8s ease-in-out infinite;
        }

        @keyframes particles {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.02); }
        }

        .back-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
            background: linear-gradient(135deg, #b8860b, #9b6f0f);
            border: 2px solid rgba(255, 215, 0, 0.6);
            border-radius: 50px;
            padding: 12px 24px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .back-btn:hover, .back-btn:active {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.3);
            border-color: rgba(255, 215, 0, 0.9);
        }

        header {
            background: rgba(5, 15, 5, 0.85);
            backdrop-filter: blur(12px);
            padding: 1rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 200;
            border-bottom: 2px solid rgba(255, 215, 0, 0.5);
        }
        .header-container {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo h1 {
            font-size: 1.3rem;
            color: #ffdd99;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        .logo p {
            font-size: 0.65rem;
            color: #c9b87a;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 5px;
            z-index: 201;
            background: none;
            border: none;
            padding: 5px;
        }
        .hamburger span {
            width: 28px;
            height: 3px;
            background: #ffdd99;
            border-radius: 3px;
            transition: all 0.3s ease;
        }
        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        .hamburger.active span:nth-child(2) {
            opacity: 0;
            transform: translateX(-10px);
        }
        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(7px, -6px);
        }

        .nav-menu {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }
        .nav-menu a {
            color: #ffdd99;
            text-decoration: none;
            font-weight: 600;
            padding: 0.5rem 1rem;
            border-radius: 25px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 215, 0, 0.3);
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        .nav-menu a:hover, .nav-menu a:active {
            background: rgba(255, 215, 0, 0.2);
            transform: translateY(-2px);
            border-color: rgba(255, 215, 0, 0.8);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .page-header {
            text-align: center;
            padding: 2rem;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            border: 1px solid rgba(255, 215, 0, 0.5);
            margin-bottom: 2rem;
        }
        .page-header h1 {
            font-size: 2rem;
            color: #ffdd99;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        .page-header p {
            color: #d4c88c;
            margin-top: 0.5rem;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.3);
            transition: 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 215, 0, 0.7);
        }
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #ffdd99;
        }
        .stat-label {
            color: #c9b87a;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .filter-section {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 30px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        .filter-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .filter-btn {
            padding: 10px 24px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            color: white;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        .filter-btn.active {
            background: linear-gradient(135deg, #b8860b, #9b6f0f);
            border-color: rgba(255, 215, 0, 0.8);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.2);
        }
        .search-box {
            display: flex;
            gap: 10px;
        }
        .search-box input {
            flex: 1;
            padding: 12px 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 16px;
            outline: none;
        }
        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        .search-box input:focus {
            border-color: #b8860b;
        }

        .tickets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .ticket-card {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 215, 0, 0.3);
            transition: all 0.4s ease;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .ticket-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 215, 0, 0.8);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.2);
        }
        .ticket-status {
            padding: 12px 20px;
            color: white;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-confirmed { background: linear-gradient(135deg, #4caf50, #2e7d32); }
        .status-cancelled { background: linear-gradient(135deg, #f44336, #c62828); }
        .status-completed { background: linear-gradient(135deg, #2196f3, #1565c0); }
        .status-expired { background: linear-gradient(135deg, #757575, #424242); }
        .ticket-body { padding: 20px; }
        .hotel-name { font-size: 1.2rem; font-weight: bold; color: #ffdd99; margin-bottom: 10px; }
        .ticket-details { margin: 15px 0; }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
        }
        .detail-label { color: #c9b87a; font-size: 0.9rem; }
        .detail-value { color: #ffdd99; font-weight: 500; }
        .ticket-price { 
            font-size: 1.3rem; 
            font-weight: bold; 
            color: #ffebbb; 
            margin: 15px 0; 
            text-align: right;
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.3);
        }
        .nfc-section {
            background: linear-gradient(135deg, rgba(184, 134, 11, 0.2), rgba(155, 111, 15, 0.2));
            border-radius: 15px;
            padding: 15px;
            margin: 15px 0;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        .nfc-icon { font-size: 2rem; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.8; } }
        
        /* Светло-серый цвет для текста NFC */
        .nfc-text-light {
            color: #d4c88c;
            font-size: 0.85rem;
            margin-top: 5px;
        }
        
        .ticket-actions { display: flex; gap: 10px; margin-top: 15px; }
        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-view { background: linear-gradient(135deg, #2196f3, #0b7dda); color: white; }
        .btn-nfc { background: linear-gradient(135deg, #ff9800, #f57c00); color: white; }
        .btn-cancel { background: linear-gradient(135deg, #f44336, #da190b); color: white; }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        .modal.active { display: flex; }
        .modal-content {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 30px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 2px solid rgba(255, 215, 0, 0.5);
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-header {
            padding: 20px;
            background: linear-gradient(135deg, #b8860b, #9b6f0f);
            color: white;
            border-radius: 28px 28px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h2 { font-size: 1.3rem; }
        .close-modal {
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
        }
        .modal-body { padding: 20px; }
        .ticket-full {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.6), rgba(30, 30, 30, 0.6));
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        .ticket-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px dashed rgba(255, 215, 0, 0.3);
        }
        .ticket-number { font-size: 1.1rem; color: #ffdd99; font-weight: bold; }
        .qr-placeholder {
            text-align: center;
            padding: 20px;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 15px;
            margin: 15px 0;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        .qr-placeholder .nfc-text-light {
            color: #d4c88c;
        }
        .nfc-badge {
            text-align: center;
            padding: 12px;
            background: linear-gradient(135deg, #b8860b, #9b6f0f);
            color: white;
            border-radius: 15px;
            margin-top: 15px;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 30px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        .empty-icon { font-size: 4rem; margin-bottom: 20px; }
        .empty-state h3 { color: #ffdd99; margin-bottom: 10px; }
        .empty-state p { color: #c9b87a; }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: #ffdd99;
            padding: 12px 24px;
            border-radius: 50px;
            z-index: 1100;
            animation: fadeInUp 0.3s ease;
            border: 1px solid rgba(255, 215, 0, 0.5);
        }
        @keyframes fadeInUp { from { transform: translateX(-50%) translateY(100px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }

        /* Стили для итоговой суммы в модальном окне */
        .total-amount {
            display: flex;
            justify-content: space-between;
            font-size: 1.3rem;
            font-weight: bold;
            background: rgba(184, 134, 11, 0.25);
            padding: 12px 15px;
            border-radius: 15px;
            margin-top: 10px;
        }
        .total-amount span:first-child {
            color: #ffebbb;
        }
        .total-amount span:last-child {
            color: #ffebbb;
            text-shadow: 0 0 3px rgba(255, 215, 0, 0.5);
        }

        @media (max-width: 768px) {
            .hamburger { display: flex; }
            .nav-menu {
                position: fixed;
                top: 0;
                left: -100%;
                width: 280px;
                height: 100vh;
                background: rgba(0, 0, 0, 0.95);
                backdrop-filter: blur(20px);
                flex-direction: column;
                justify-content: center;
                gap: 1.5rem;
                padding: 2rem 1.5rem;
                z-index: 150;
                transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
                border-right: 2px solid rgba(255, 215, 0, 0.5);
            }
            .nav-menu.active { left: 0; }
            .nav-menu a { width: 100%; text-align: center; padding: 0.8rem; font-size: 1.1rem; }
            .menu-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.5);
                z-index: 140;
                opacity: 0;
                visibility: hidden;
                transition: all 0.3s ease;
            }
            .menu-overlay.active { opacity: 1; visibility: visible; }
            .tickets-grid { grid-template-columns: 1fr; }
            .stats { grid-template-columns: 1fr 1fr; }
            .filter-buttons { flex-direction: column; }
            .filter-btn { text-align: center; }
            .search-box { flex-direction: column; }
            .back-btn { bottom: 10px; left: 10px; padding: 8px 16px; font-size: 12px; }
            .page-header h1 { font-size: 1.5rem; }
        }
        @media (max-width: 480px) { 
            .page-header h1 { font-size: 1.3rem; }
            .total-amount { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div class="menu-overlay" id="menuOverlay"></div>

    <header>
        <div class="header-container">
            <div class="logo">
                <h1>🏔️ PermTravel</h1>
                <p>Пермский край • Уральская природа</p>
            </div>
            <button class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="nav-menu" id="navMenu">
                <a href="profile.html">🏠 Профиль</a>
                <a href="hotels.html">🏨 Все отели</a>
                <a href="account.html">👤 Регистрация</a>
                <a href="payment.html">💳 NFC билеты</a>
                <a href="reviews.html">💬 Отзывы</a>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="back-btn" onclick="goBack()">⬅️ Вернуться к отелям</div>

        <div class="page-header">
            <h1>🎫 Мои NFC билеты</h1>
            <p style="color: #d4c88c;">Приложите телефон к считывателю для заселения в отель</p>
        </div>

        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalTickets">0</div>
                <div class="stat-label">Всего билетов</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="activeTickets">0</div>
                <div class="stat-label">Активных</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalSpent">0.00 ₽</div>
                <div class="stat-label">Потрачено</div>
            </div>
        </div>

        <div class="filter-section">
            <div class="filter-buttons">
                <button class="filter-btn active" data-status="all" onclick="filterByStatus('all')">📋 Все билеты</button>
                <button class="filter-btn" data-status="confirmed" onclick="filterByStatus('confirmed')">✅ Активные</button>
                <button class="filter-btn" data-status="completed" onclick="filterByStatus('completed')">⭐ Использованные</button>
                <button class="filter-btn" data-status="expired" onclick="filterByStatus('expired')">⏰ Завершённые</button>
                <button class="filter-btn" data-status="cancelled" onclick="filterByStatus('cancelled')">❌ Отмененные</button>
            </div>
            <div class="search-box">
                <input type="text" id="searchTickets" placeholder="🔍 Поиск по названию отеля..." onkeyup="searchTickets()">
            </div>
        </div>

        <div id="ticketsList" class="tickets-grid"></div>
    </div>

    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🎫 NFC электронный билет</h2>
                <button class="close-modal" onclick="closeDetailsModal()">×</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script>
        let allBookings = [];
        let currentUser = null;
        let currentStatusFilter = "all";
        let currentSearchTerm = "";

        function isBookingExpired(booking) {
            if (booking.status === 'cancelled' || booking.status === 'completed') return false;
            const checkoutDate = new Date(booking.checkout);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            return checkoutDate < today;
        }

        function updateBookingStatuses() {
            let updated = false;
            allBookings.forEach(booking => {
                if (booking.status === 'confirmed' && isBookingExpired(booking)) {
                    booking.status = 'expired';
                    updated = true;
                }
            });
            if (updated) {
                localStorage.setItem('bookings', JSON.stringify(allBookings));
            }
        }

        function initUser() {
            try {
                const saved = localStorage.getItem('currentUser');
                if (saved) {
                    currentUser = JSON.parse(saved);
                } else {
                    currentUser = null;
                }
            } catch(e) {
                currentUser = null;
            }
        }

        function loadTickets() {
            const saved = localStorage.getItem('bookings');
            if (saved) {
                allBookings = JSON.parse(saved);
                updateBookingStatuses();
            } else {
                allBookings = [];
            }
            updateStats();
            displayTickets();
        }

        function updateStats() {
            let displayBookings = allBookings;
            if (currentUser) {
                displayBookings = allBookings.filter(t => t.email === currentUser.email);
            }
            const total = displayBookings.length;
            const active = displayBookings.filter(t => (t.status === 'confirmed' || !t.status) && !isBookingExpired(t)).length;
            const totalSpent = displayBookings.reduce((sum, t) => {
                if (t.status !== 'cancelled' && t.status !== 'expired') {
                    const amount = parseInt(t.total.toString().replace(/[^\d.-]/g, '')) || 0;
                    return sum + amount;
                }
                return sum;
            }, 0);
            document.getElementById('totalTickets').textContent = total;
            document.getElementById('activeTickets').textContent = active;
            document.getElementById('totalSpent').textContent = totalSpent.toLocaleString() + ' ₽';
        }

        function filterByStatus(status) {
            currentStatusFilter = status;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.filter-btn[data-status="${status}"]`).classList.add('active');
            displayTickets();
        }

        function searchTickets() {
            currentSearchTerm = document.getElementById('searchTickets').value.toLowerCase();
            displayTickets();
        }

        function getTicketStatus(ticket) {
            if (ticket.status === 'cancelled') return 'cancelled';
            if (ticket.status === 'completed') return 'completed';
            if (ticket.status === 'expired') return 'expired';
            if (isBookingExpired(ticket)) return 'expired';
            return 'confirmed';
        }

        function displayTickets() {
            let sourceBookings = allBookings;
            if (currentUser) {
                sourceBookings = allBookings.filter(t => t.email === currentUser.email);
            }

            let filtered = sourceBookings.filter(ticket => {
                const ticketStatus = getTicketStatus(ticket);
                const matchStatus = currentStatusFilter === "all" || ticketStatus === currentStatusFilter;
                const matchSearch = ticket.hotel.toLowerCase().includes(currentSearchTerm);
                return matchStatus && matchSearch;
            });
            filtered.sort((a, b) => b.id - a.id);

            const container = document.getElementById('ticketsList');
            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📭</div>
                        <h3>Нет билетов</h3>
                        <p>У вас пока нет активных билетов. Забронируйте отель и получите NFC билет!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(ticket => {
                const ticketStatus = getTicketStatus(ticket);
                const statusText = ticketStatus === 'confirmed' ? '✅ Активен' : 
                                  (ticketStatus === 'completed' ? '⭐ Использован' : 
                                  (ticketStatus === 'expired' ? '⏰ Завершён' : '❌ Отменен'));
                const statusClass = ticketStatus === 'confirmed' ? 'status-confirmed' : 
                                   (ticketStatus === 'completed' ? 'status-completed' : 
                                   (ticketStatus === 'expired' ? 'status-expired' : 'status-cancelled'));
                const checkinDate = new Date(ticket.checkin).toLocaleDateString('ru-RU');
                const checkoutDate = new Date(ticket.checkout).toLocaleDateString('ru-RU');
                const isOwner = currentUser && ticket.email === currentUser.email;
                const showCancel = (ticketStatus === 'confirmed') && isOwner;
                const discountInfo = ticket.discountType ? `<div class="detail-row"><span class="detail-label">🎁 Льгота:</span><span class="detail-value">${escapeHtml(ticket.discountType)}</span></div>` : '';

                return `
                    <div class="ticket-card">
                        <div class="ticket-status ${statusClass}">
                            <span>${statusText}</span>
                            <span>🔖 #${ticket.id}</span>
                        </div>
                        <div class="ticket-body">
                            <div class="hotel-name">🏨 ${escapeHtml(ticket.hotel)}</div>
                            <div class="ticket-details">
                                <div class="detail-row">
                                    <span class="detail-label">📅 Заезд:</span>
                                    <span class="detail-value">${checkinDate}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label">📅 Выезд:</span>
                                    <span class="detail-value">${checkoutDate}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label">👥 Гостей:</span>
                                    <span class="detail-value">${ticket.guests}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label">👤 Гость:</span>
                                    <span class="detail-value">${escapeHtml(ticket.guestName)}</span>
                                </div>
                                ${discountInfo}
                                ${ticket.roomNumber ? `<div class="detail-row">
                                    <span class="detail-label">🚪 Номер:</span>
                                    <span class="detail-value">${ticket.roomNumber}</span>
                                </div>` : ''}
                            </div>
                            <div class="ticket-price">💰 ${ticket.total}</div>
                            ${ticketStatus === 'confirmed' ? `
                                <div class="nfc-section">
                                    <div class="nfc-icon">📱🔵</div>
                                    <div class="nfc-text-light">NFC-метка для заселения</div>
                                </div>
                            ` : ''}
                            <div class="ticket-actions">
                                <button class="btn btn-view" onclick="viewDetails(${ticket.id})">👁️ Показать билет</button>
                                ${ticketStatus === 'confirmed' ? `<button class="btn btn-nfc" onclick="useNFC(${ticket.id})">📱 NFC заселение</button>` : ''}
                                ${showCancel ? `<button class="btn btn-cancel" onclick="cancelTicket(${ticket.id})">❌ Отменить</button>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function viewDetails(ticketId) {
            let ticket = allBookings.find(t => t.id === ticketId);
            if (!ticket) return;

            const modal = document.getElementById('detailsModal');
            const modalBody = document.getElementById('modalBody');
            const ticketStatus = getTicketStatus(ticket);

            const checkinDate = new Date(ticket.checkin).toLocaleDateString('ru-RU', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            const checkoutDate = new Date(ticket.checkout).toLocaleDateString('ru-RU', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            const nights = Math.ceil((new Date(ticket.checkout) - new Date(ticket.checkin)) / (1000 * 60 * 60 * 24));
            const discountDetail = ticket.discountType ? `<div class="detail-row"><span class="detail-label">🎁 Льгота:</span><span class="detail-value">${escapeHtml(ticket.discountType)}</span></div>` : '';

            modalBody.innerHTML = `
                <div class="ticket-full">
                    <div class="ticket-header">
                        <div class="ticket-number">🎫 NFC БИЛЕТ #${ticket.id}</div>
                        <div style="font-size: 1.2rem; font-weight: bold; margin-top: 10px; color: #ffdd99;">${escapeHtml(ticket.hotel)}</div>
                    </div>
                    <div class="qr-placeholder">
                        <div style="font-size: 3rem;">📱</div>
                        <div class="nfc-text-light">NFC-метка готова к считыванию</div>
                        <div style="font-size: 0.7rem; margin-top: 5px; color: #d4c88c;">Приложите телефон к считывателю</div>
                    </div>
                    <div style="margin: 15px 0;">
                        <div class="detail-row"><span class="detail-label">Гость:</span><span class="detail-value"><strong>${escapeHtml(ticket.guestName)}</strong></span></div>
                        <div class="detail-row"><span class="detail-label">Телефон:</span><span class="detail-value">${ticket.phone}</span></div>
                        <div class="detail-row"><span class="detail-label">Email:</span><span class="detail-value">${ticket.email || 'не указан'}</span></div>
                        <div class="detail-row"><span class="detail-label">Дата заезда:</span><span class="detail-value">${checkinDate}</span></div>
                        <div class="detail-row"><span class="detail-label">Дата выезда:</span><span class="detail-value">${checkoutDate}</span></div>
                        <div class="detail-row"><span class="detail-label">Количество ночей:</span><span class="detail-value">${nights}</span></div>
                        <div class="detail-row"><span class="detail-label">Гостей:</span><span class="detail-value">${ticket.guests}</span></div>
                        ${discountDetail}
                        ${ticket.roomNumber ? `<div class="detail-row"><span class="detail-label">Номер комнаты:</span><span class="detail-value">${ticket.roomNumber}</span></div>` : ''}
                        <div class="detail-row"><span class="detail-label">Статус:</span><span class="detail-value">${ticketStatus === 'confirmed' ? '✅ Активен' : (ticketStatus === 'completed' ? '⭐ Использован' : (ticketStatus === 'expired' ? '⏰ Завершён' : '❌ Отменен'))}</span></div>
                    </div>
                    <div class="total-amount">
                        <span>💳 Итого к оплате:</span>
                        <span>${ticket.total}</span>
                    </div>
                    <div class="nfc-badge">
                        📱 NFC Ready • Приложите телефон к считывателю
                        <div style="font-size: 0.7rem; margin-top: 5px;">Номер брони: #${ticket.id}</div>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    ${ticketStatus === 'confirmed' ? `<button class="btn btn-nfc" style="flex: 1;" onclick="useNFC(${ticket.id}); closeDetailsModal();">📱 Использовать NFC</button>` : ''}
                    <button class="btn btn-view" style="flex: 1;" onclick="closeDetailsModal()">Закрыть</button>
                </div>
            `;
            modal.classList.add('active');
        }

        function useNFC(ticketId) {
            const ticket = allBookings.find(t => t.id === ticketId);
            if (!ticket) return;
            if (getTicketStatus(ticket) !== 'confirmed') {
                showToast('❌ Этот билет уже неактивен');
                return;
            }

            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const checkinDate = new Date(ticket.checkin);
            checkinDate.setHours(0, 0, 0, 0);
            const checkoutDate = new Date(ticket.checkout);
            checkoutDate.setHours(0, 0, 0, 0);

            if (today < checkinDate) {
                showToast(`❌ Заселение возможно только с ${checkinDate.toLocaleDateString('ru-RU')}`);
                return;
            }
            if (today >= checkoutDate) {
                showToast(`❌ Дата выезда ${checkoutDate.toLocaleDateString('ru-RU')} уже прошла. Заселение невозможно.`);
                return;
            }

            showToast(`📱 NFC: Приложите телефон к считывателю для заселения в отель "${ticket.hotel}"`);
            setTimeout(() => {
                const confirmNFC = confirm(`✅ NFC-метка считана!\n\nОтель: ${ticket.hotel}\nГость: ${ticket.guestName}\nНомер билета: #${ticket.id}\n\nПодтвердить заселение?`);
                if (confirmNFC) {
                    ticket.status = 'completed';
                    localStorage.setItem('bookings', JSON.stringify(allBookings));
                    loadTickets();
                    showToast(`✅ Заселение подтверждено! Добро пожаловать в отель "${ticket.hotel}"`);
                    closeDetailsModal();
                }
            }, 2000);
        }

        function cancelTicket(ticketId) {
            const ticket = allBookings.find(t => t.id === ticketId);
            if (!ticket) return;
            if (!currentUser || ticket.email !== currentUser.email) {
                showToast('❌ Вы можете отменить только свои билеты');
                return;
            }
            if (getTicketStatus(ticket) !== 'confirmed') {
                showToast('❌ Этот билет уже нельзя отменить');
                return;
            }
            const confirmCancel = confirm(`❌ Вы уверены, что хотите отменить билет в отеле "${ticket.hotel}"?\n\nСумма: ${ticket.total}\nДата заезда: ${new Date(ticket.checkin).toLocaleDateString('ru-RU')}\n\nСредства будут возвращены в течение 3-5 рабочих дней.`);
            if (confirmCancel) {
                ticket.status = 'cancelled';
                localStorage.setItem('bookings', JSON.stringify(allBookings));
                loadTickets();
                showToast(`❌ Билет #${ticketId} отменен. Средства будут возвращены на карту.`);
            }
        }

        function closeDetailsModal() {
            document.getElementById('detailsModal').classList.remove('active');
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function goBack() {
            window.location.href = 'hotels.html';
        }

        function init() {
            initUser();
            if (!currentUser) {
                window.location.href = 'account.html';
                return;
            }
            loadTickets();
        }

        // Бургер-меню
        const hamburger = document.getElementById('hamburger');
        const navMenu = document.getElementById('navMenu');
        const menuOverlay = document.getElementById('menuOverlay');
        function closeMenu() { hamburger.classList.remove('active'); navMenu.classList.remove('active'); if (menuOverlay) menuOverlay.classList.remove('active'); document.body.style.overflow = ''; }
        function openMenu() { hamburger.classList.add('active'); navMenu.classList.add('active'); if (menuOverlay) menuOverlay.classList.add('active'); document.body.style.overflow = 'hidden'; }
        if (hamburger) hamburger.addEventListener('click', (e) => { e.stopPropagation(); navMenu.classList.contains('active') ? closeMenu() : openMenu(); });
        if (menuOverlay) menuOverlay.addEventListener('click', closeMenu);
        document.querySelectorAll('.nav-menu a').forEach(link => link.addEventListener('click', closeMenu));
        window.addEventListener('resize', () => { if (window.innerWidth > 768) closeMenu(); });
        document.getElementById('detailsModal').addEventListener('click', (e) => { if (e.target === document.getElementById('detailsModal')) closeDetailsModal(); });

        init();
    </script>
</body>
</html>
