<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
<meta name="theme-color" content="#0f2a0f">
<title>Отзывы об отелях Пермского края</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    background: radial-gradient(circle at 20% 20%, #1a3a1a, #0f2a0f);
    color: white;
    padding: 16px;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
}

.container {
    max-width: 800px;
    margin: 0 auto;
    width: 100%;
}

.top-btn, button {
    display: block;
    text-align: center;
    padding: 14px 20px;
    border-radius: 30px;
    text-decoration: none;
    background: linear-gradient(135deg, #b8860b, #9b6f0f);
    color: white;
    border: none;
    cursor: pointer;
    font-size: 16px;
    font-weight: 500;
    transition: all 0.2s ease;
}

.top-btn {
    margin-bottom: 20px;
    background: linear-gradient(135deg, #d4941a, #b87a0f);
}

button:active, .top-btn:active {
    transform: scale(0.98);
    opacity: 0.9;
}

.form {
    background: rgba(0, 0, 0, 0.65);
    padding: 20px;
    border-radius: 20px;
    border: 1px solid rgba(255, 215, 0, 0.4);
    margin-bottom: 20px;
    backdrop-filter: blur(5px);
}

.form h2 {
    margin-bottom: 15px;
    font-size: 1.4rem;
    color: #ffdd99;
}

select, textarea, input {
    width: 100%;
    padding: 12px 15px;
    margin-top: 10px;
    margin-bottom: 15px;
    border: 1px solid rgba(255, 215, 0, 0.3);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.1);
    color: white;
    font-size: 16px;
    transition: all 0.2s ease;
}

select:focus, textarea:focus, input:focus {
    outline: none;
    border-color: #b8860b;
    background: rgba(255, 255, 255, 0.15);
}

select option {
    background: #1a3a1a;
    color: white;
}

textarea {
    min-height: 100px;
    resize: vertical;
    font-family: inherit;
}

.rating-group {
    margin: 10px 0 15px 0;
}

.rating-group label {
    display: block;
    margin-bottom: 8px;
    color: #ffdd99;
    font-weight: 500;
}

.stars {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.star-btn {
    background: rgba(255, 255, 255, 0.1);
    padding: 10px 16px;
    border-radius: 40px;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid rgba(255, 215, 0, 0.3);
}

.star-btn.active {
    background: linear-gradient(135deg, #ffb347, #ff8c00);
    border-color: #ffdd99;
    color: white;
    transform: scale(1.02);
}

.card {
    background: rgba(0, 0, 0, 0.7);
    padding: 16px;
    border-radius: 16px;
    margin-bottom: 12px;
    border: 1px solid rgba(255, 215, 0, 0.3);
    backdrop-filter: blur(3px);
    transition: all 0.2s ease;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.card h3 {
    color: #ffdd99;
    margin-bottom: 8px;
    font-size: 1.1rem;
    word-break: break-word;
}

.card p {
    margin: 10px 0;
    line-height: 1.5;
    word-break: break-word;
}

.rating-stars {
    display: inline-flex;
    gap: 3px;
    margin-left: 8px;
    font-size: 0.9rem;
}

.title {
    color: #ffdd99;
    margin: 20px 0 15px 0;
    font-size: 1.3rem;
}

.empty-state {
    text-align: center;
    padding: 30px;
    color: rgba(255, 255, 255, 0.6);
}

.card-actions {
    margin-top: 12px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}
.edit-btn {
    background: linear-gradient(135deg, #2a6f97, #1e5a7a);
}
.delete-btn {
    background: linear-gradient(135deg, #8b0000, #6b0000);
}

.filter-section {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.filter-btn-sm {
    background: rgba(0, 0, 0, 0.5);
    padding: 8px 16px;
    border-radius: 30px;
    font-size: 14px;
    border: 1px solid rgba(255, 215, 0, 0.3);
    cursor: pointer;
}

.filter-btn-sm.active {
    background: linear-gradient(135deg, #b8860b, #9b6f0f);
}

.average-rating {
    background: rgba(0, 0, 0, 0.5);
    border-radius: 20px;
    padding: 12px 16px;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
}

@media (max-width: 480px) {
    body {
        padding: 12px;
    }
    .form {
        padding: 16px;
    }
    .card {
        padding: 14px;
    }
    .title {
        font-size: 1.2rem;
    }
    .top-btn, button {
        padding: 12px 16px;
        font-size: 15px;
    }
    .card-actions {
        flex-direction: column;
    }
    .card-actions button {
        width: 100%;
    }
    .star-btn {
        padding: 6px 12px;
        font-size: 14px;
    }
}

::-webkit-scrollbar {
    width: 6px;
}
::-webkit-scrollbar-track {
    background: rgba(0, 0, 0, 0.3);
    border-radius: 3px;
}
::-webkit-scrollbar-thumb {
    background: #b8860b;
    border-radius: 3px;
}
</style>
</head>

<body>

<div class="container">

<a href="javascript:void(0)" class="top-btn" onclick="goToMain()">🏠 На главную</a>

<div class="form" id="formBlock">
    <h2 id="formTitle">💬 Оставить отзыв об отеле</h2>

    <select id="hotelSelect">
        <option value="">-- Выберите отель --</option>
    </select>

    <div class="rating-group">
        <label>⭐ Ваша оценка</label>
        <div class="stars" id="starsContainer">
            <div class="star-btn" data-rating="1">1 ★</div>
            <div class="star-btn" data-rating="2">2 ★★</div>
            <div class="star-btn" data-rating="3">3 ★★★</div>
            <div class="star-btn" data-rating="4">4 ★★★★</div>
            <div class="star-btn" data-rating="5">5 ★★★★★</div>
        </div>
    </div>

    <textarea id="text" placeholder="Расскажите о вашем впечатлении об отеле... (минимум 5 символов)" maxlength="500"></textarea>

    <button onclick="saveReview()">💾 Сохранить отзыв</button>
    <button onclick="clearForm()" style="background: linear-gradient(135deg, #666, #444); margin-top: 8px;">🗑 Очистить форму</button>
</div>

<div class="average-rating" id="avgRatingBlock">
    <span>🏨 Средний рейтинг всех отелей:</span>
    <span id="globalAvgRating">—</span>
</div>

<h2 class="title">📝 Все отзывы об отелях</h2>

<div class="filter-section">
    <div class="filter-btn-sm active" data-filter="all" onclick="filterReviews('all')">🏨 Все отели</div>
    <div class="filter-btn-sm" data-filter="econom" onclick="filterReviews('econom')">💰 Эконом</div>
    <div class="filter-btn-sm" data-filter="comfort" onclick="filterReviews('comfort')">⭐ Комфорт</div>
    <div class="filter-btn-sm" data-filter="premium" onclick="filterReviews('premium')">👑 Премиум</div>
</div>

<div id="reviews"></div>
</div>

<script>
// СПИСОК ОТЕЛЕЙ (синхронизирован с hotels.html)
const HOTELS_DATA = [
    { id: 1, name: "Гостиница «Урал»", class: "econom", location: "Пермь, ул. Ленина, 58" },
    { id: 2, name: "Отель «Прикамье»", class: "econom", location: "Пермь, шоссе Космонавтов, 162" },
    { id: 3, name: "Гостевой дом «Pride»", class: "econom", location: "Березники, ул. Березовская, 12" },
    { id: 4, name: "Мини-отель «Спутник»", class: "econom", location: "Соликамск, ул. Северная, 45" },
    { id: 5, name: "Гостиница «Адам и Ева»", class: "econom", location: "Пермь, ул. Пушкарская, 100" },
    { id: 6, name: "Отель «Element»", class: "comfort", location: "Пермь, ул. Мира, 39" },
    { id: 7, name: "Гостиница «Атриум»", class: "comfort", location: "Пермь, ул. Куйбышева, 68" },
    { id: 8, name: "Отель «Green Village»", class: "comfort", location: "Пермский р-н, д. Кондратово" },
    { id: 9, name: "Отель «Сталагмит»", class: "comfort", location: "Кунгур, ул. Октябрьская, 15" },
    { id: 10, name: "Гостиница «Чайковский Арт»", class: "comfort", location: "Чайковский, ул. Вокзальная, 18" },
    { id: 11, name: "Hyatt Regency Perm", class: "premium", location: "Пермь, ул. Мира, 45" },
    { id: 12, name: "Park Hotel «Пермский»", class: "premium", location: "Пермь, шоссе Космонавтов, 111" },
    { id: 13, name: "Отель «Белый Камень»", class: "premium", location: "Пермский р-н, д. Курашим" },
    { id: 14, name: "Grand Hotel «Усьва»", class: "premium", location: "Гремячинский р-н, пос. Усьва" },
    { id: 15, name: "Отель «Княжий двор»", class: "premium", location: "Пермь, ул. Монастырская, 12" }
];

let currentUser = null;
let editId = null;
let currentFilterClass = "all"; // all, econom, comfort, premium
let selectedRating = 0;

// Список запрещённых слов (матерные слова)
const profanityList = [
    "хуй", "хую", "хуя", "хуём", "хуе", "хуё", "пизд", "пизда", "пизде", "пизду", "пиздой",
    "бля", "блядь", "бляди", "блядью", "блядский", "ебал", "ебать", "ебу", "ебёт", "ебаный",
    "ебану", "ебанут", "ебли", "ебло", "ебуч", "ёбар", "ёбнуть", "мудила", "мудак", "мудаком",
    "мудило", "мудозвон", "гандон", "гандона", "пидор", "пидорас", "пидора", "петух", "петуха",
    "сучка", "сука", "суки", "сукой", "шлюха", "шлюхой", "курва", "курвой", "проститутка",
    "жопа", "жопой", "жопе", "жопы", "говно", "говна", "говном", "дерьмо", "дерьма", "хер",
    "хера", "херня", "хрен", "хрена", "хреново", "член", "члена", "членом", "секс", "трахать",
    "трахнуть", "выебать", "вьебать", "заебать", "заебал", "доебаться", "отъебаться",
    "fuck", "shit", "bitch", "cunt", "dick", "asshole", "bastard"
];

function containsProfanity(text) {
    if (!text) return false;
    const lowerText = text.toLowerCase();
    for (let word of profanityList) {
        const regex = new RegExp(`\\b${word}\\b|${word}`, 'i');
        if (regex.test(lowerText)) {
            return true;
        }
    }
    return false;
}

function initUser() {
    try {
        const savedUser = localStorage.getItem('currentUser');
        if (savedUser) {
            currentUser = JSON.parse(savedUser);
        } else {
            currentUser = {
                fullname: "Гость",
                email: "guest@example.com"
            };
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
        }
    } catch (e) {
        currentUser = {
            fullname: "Гость",
            email: "guest@example.com"
        };
    }
}

function goToMain() {
    if (confirm('Перейти на главную страницу?')) {
        window.location.href = 'index.html';
    }
}

function clearForm() {
    document.getElementById('text').value = '';
    document.getElementById('hotelSelect').value = '';
    selectedRating = 0;
    updateStarButtons();
    editId = null;
    const formTitle = document.getElementById('formTitle');
    if (formTitle) formTitle.textContent = '💬 Оставить отзыв об отеле';
}

function updateStarButtons() {
    document.querySelectorAll('.star-btn').forEach(btn => {
        const rating = parseInt(btn.dataset.rating);
        if (rating === selectedRating) {
            btn.classList.add('active');
        } else {
            btn.classList.remove('active');
        }
    });
}

function setupStarListeners() {
    document.querySelectorAll('.star-btn').forEach(btn => {
        btn.onclick = () => {
            selectedRating = parseInt(btn.dataset.rating);
            updateStarButtons();
        };
    });
}

function saveReview() {
    if (!currentUser) {
        alert('❌ Пожалуйста, войдите в систему');
        return;
    }
    
    const hotelId = parseInt(document.getElementById('hotelSelect').value);
    if (!hotelId) {
        alert('⚠️ Пожалуйста, выберите отель');
        return;
    }
    
    let text = document.getElementById('text').value.trim();
    
    if (!text) {
        alert('⚠️ Пожалуйста, введите текст отзыва');
        document.getElementById('text').focus();
        return;
    }
    
    if (text.length < 5) {
        alert('⚠️ Отзыв должен содержать минимум 5 символов');
        document.getElementById('text').focus();
        return;
    }
    
    if (selectedRating === 0) {
        alert('⚠️ Пожалуйста, поставьте оценку отелю (от 1 до 5 звёзд)');
        return;
    }
    
    if (containsProfanity(text)) {
        alert('❌ Ваш отзыв содержит недопустимые выражения. Пожалуйста, отредактируйте текст.');
        document.getElementById('text').focus();
        return;
    }
    
    const selectedHotel = HOTELS_DATA.find(h => h.id === hotelId);
    if (!selectedHotel) {
        alert('❌ Отель не найден');
        return;
    }
    
    try {
        let reviews = JSON.parse(localStorage.getItem('hotel_reviews')) || [];
        
        if (editId) {
            const index = reviews.findIndex(r => r.id === editId);
            if (index !== -1) {
                if (reviews[index].email !== currentUser.email) {
                    alert('❌ Вы можете редактировать только свои отзывы');
                    return;
                }
                reviews[index] = {
                    ...reviews[index],
                    hotelId: hotelId,
                    hotelName: selectedHotel.name,
                    hotelClass: selectedHotel.class,
                    rating: selectedRating,
                    text: text,
                    editedAt: new Date().toISOString()
                };
                alert('✅ Отзыв обновлён!');
            } else {
                alert('❌ Отзыв не найден');
                return;
            }
            editId = null;
            const formTitle = document.getElementById('formTitle');
            if (formTitle) formTitle.textContent = '💬 Оставить отзыв об отеле';
        } else {
            const newReview = {
                id: Date.now(),
                user: currentUser.fullname,
                email: currentUser.email,
                hotelId: hotelId,
                hotelName: selectedHotel.name,
                hotelClass: selectedHotel.class,
                rating: selectedRating,
                text: text,
                createdAt: new Date().toISOString()
            };
            reviews.push(newReview);
            alert('✅ Отзыв успешно добавлен!');
        }
        
        localStorage.setItem('hotel_reviews', JSON.stringify(reviews));
        clearForm();
        loadAndDisplayReviews();
        updateGlobalAverageRating();
    } catch (e) {
        alert('❌ Произошла ошибка при сохранении отзыва');
    }
}

function editReview(review) {
    if (review.email !== currentUser.email) {
        alert('❌ Вы можете редактировать только свои отзывы');
        return;
    }
    
    document.getElementById('hotelSelect').value = review.hotelId;
    selectedRating = review.rating;
    updateStarButtons();
    document.getElementById('text').value = review.text;
    editId = review.id;
    
    const formTitle = document.getElementById('formTitle');
    if (formTitle) formTitle.textContent = '✏️ Редактирование отзыва';
    
    document.getElementById('formBlock').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function deleteReview(id, email) {
    if (email !== currentUser.email) {
        alert('❌ Вы можете удалять только свои отзывы');
        return;
    }
    
    if (confirm('⚠️ Вы уверены, что хотите удалить этот отзыв?')) {
        try {
            let reviews = JSON.parse(localStorage.getItem('hotel_reviews')) || [];
            reviews = reviews.filter(r => r.id !== id);
            localStorage.setItem('hotel_reviews', JSON.stringify(reviews));
            alert('✅ Отзыв удалён');
            loadAndDisplayReviews();
            updateGlobalAverageRating();
        } catch (e) {
            alert('❌ Ошибка при удалении');
        }
    }
}

function formatDate(dateString) {
    if (!dateString) return '';
    try {
        const date = new Date(dateString);
        return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' });
    } catch (e) {
        return '';
    }
}

function escapeHtml(str) {
    if (!str) return '';
    return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function getRatingStars(rating) {
    const fullStar = '⭐';
    const emptyStar = '☆';
    let stars = '';
    for (let i = 1; i <= 5; i++) {
        stars += i <= rating ? fullStar : emptyStar;
    }
    return stars;
}

function filterReviews(classFilter) {
    currentFilterClass = classFilter;
    document.querySelectorAll('.filter-btn-sm').forEach(btn => {
        if (btn.dataset.filter === classFilter) {
            btn.classList.add('active');
        } else {
            btn.classList.remove('active');
        }
    });
    loadAndDisplayReviews();
}

function loadAndDisplayReviews() {
    try {
        let reviews = JSON.parse(localStorage.getItem('hotel_reviews')) || [];
        
        // Фильтрация по классу отеля
        if (currentFilterClass !== 'all') {
            reviews = reviews.filter(r => r.hotelClass === currentFilterClass);
        }
        
        const reviewDiv = document.getElementById('reviews');
        reviewDiv.innerHTML = '';
        
        if (reviews.length === 0) {
            let filterText = '';
            if (currentFilterClass === 'econom') filterText = ' в категории "Эконом"';
            else if (currentFilterClass === 'comfort') filterText = ' в категории "Комфорт"';
            else if (currentFilterClass === 'premium') filterText = ' в категории "Премиум"';
            reviewDiv.innerHTML = `<div class="empty-state">📭 Пока нет отзывов${filterText}. Оставьте первый!</div>`;
            return;
        }
        
        const sortedReviews = [...reviews].reverse();
        sortedReviews.forEach(r => {
            const el = document.createElement('div');
            el.className = 'card';
            
            let dateText = '';
            if (r.createdAt) {
                dateText = `<div style="color: #888; font-size: 0.8rem; margin-top: 5px;">📅 ${formatDate(r.createdAt)}</div>`;
            }
            if (r.editedAt) {
                dateText += `<div style="color: #888; font-size: 0.7rem;">(ред. ${formatDate(r.editedAt)})</div>`;
            }
            
            // Определяем класс отеля для бейджа
            let classBadge = '';
            if (r.hotelClass === 'econom') classBadge = '<span style="background: #4caf50; padding: 2px 8px; border-radius: 20px; font-size: 0.7rem;">💰 Эконом</span>';
            else if (r.hotelClass === 'comfort') classBadge = '<span style="background: #2196f3; padding: 2px 8px; border-radius: 20px; font-size: 0.7rem;">⭐ Комфорт</span>';
            else if (r.hotelClass === 'premium') classBadge = '<span style="background: #ff9800; padding: 2px 8px; border-radius: 20px; font-size: 0.7rem;">👑 Премиум</span>';
            
            el.innerHTML = `
                <h3>👤 ${escapeHtml(r.user)} • ${escapeHtml(r.hotelName)} ${classBadge}</h3>
                <div style="display: flex; align-items: center; gap: 8px; margin: 5px 0;">
                    <span style="font-size: 1rem;">${getRatingStars(r.rating)}</span>
                    <span style="color: #ffdd99;">${r.rating}/5</span>
                </div>
                <p>💬 ${escapeHtml(r.text)}</p>
                ${dateText}
            `;
            
            if (currentUser && r.email === currentUser.email) {
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'card-actions';
                
                const editBtn = document.createElement('button');
                editBtn.textContent = '✏️ Редактировать';
                editBtn.className = 'edit-btn';
                editBtn.onclick = () => editReview(r);
                
                const delBtn = document.createElement('button');
                delBtn.textContent = '🗑 Удалить';
                delBtn.className = 'delete-btn';
                delBtn.onclick = () => deleteReview(r.id, r.email);
                
                actionsDiv.appendChild(editBtn);
                actionsDiv.appendChild(delBtn);
                el.appendChild(actionsDiv);
            }
            
            reviewDiv.appendChild(el);
        });
    } catch (e) {
        document.getElementById('reviews').innerHTML = '<div class="empty-state">❌ Ошибка загрузки отзывов</div>';
    }
}

function updateGlobalAverageRating() {
    try {
        const reviews = JSON.parse(localStorage.getItem('hotel_reviews')) || [];
        if (reviews.length === 0) {
            document.getElementById('globalAvgRating').textContent = 'Нет отзывов';
            return;
        }
        const sum = reviews.reduce((acc, r) => acc + r.rating, 0);
        const avg = (sum / reviews.length).toFixed(1);
        const stars = getRatingStars(Math.round(avg));
        document.getElementById('globalAvgRating').innerHTML = `${stars} ${avg}/5 (${reviews.length} отзывов)`;
    } catch (e) {
        document.getElementById('globalAvgRating').textContent = '—';
    }
}

function loadHotelsSelect() {
    const select = document.getElementById('hotelSelect');
    select.innerHTML = '<option value="">-- Выберите отель --</option>';
    HOTELS_DATA.forEach(hotel => {
        const option = document.createElement('option');
        option.value = hotel.id;
        let classLabel = '';
        if (hotel.class === 'econom') classLabel = '💰 ';
        else if (hotel.class === 'comfort') classLabel = '⭐ ';
        else if (hotel.class === 'premium') classLabel = '👑 ';
        option.textContent = `${classLabel}${hotel.name} (${hotel.location})`;
        select.appendChild(option);
    });
}

function init() {
    initUser();
    loadHotelsSelect();
    setupStarListeners();
    loadAndDisplayReviews();
    updateGlobalAverageRating();
    
    const textarea = document.getElementById('text');
    if (textarea) {
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
        });
    }
    
    // Обработка изменения выбора отеля (можно добавить подсказку)
    const hotelSelect = document.getElementById('hotelSelect');
    if (hotelSelect) {
        hotelSelect.addEventListener('change', function() {
            if (editId) return;
            // Небольшая подсказка
        });
    }
}

// Экспорт для возможного использования в других скриптах
window.filterReviews = filterReviews;
window.saveReview = saveReview;
window.clearForm = clearForm;
window.goToMain = goToMain;
window.editReview = editReview;
window.deleteReview = deleteReview;

init();
</script>
